script:
  flush_sequence:
    alias: "Flush Sequence"
    sequence:

      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.flush_in_progress

      # --- Valve 1 ---
      - service: switch.turn_on
        target:
          entity_id: switch.valve1_open
      - delay: "00:00:00.500"                  # 0.5s open pulse
      - service: switch.turn_off
        target:
          entity_id: switch.valve1_open

      - delay: "00:00:20"                      # 20s flush duration

      - service: switch.turn_on
        target:
          entity_id: switch.valve1_close
      - delay: "00:00:00.500"                  # 0.5s close pulse
      - service: switch.turn_off
        target:
          entity_id: switch.valve1_close

      - delay: "00:00:20"                      # 20s between drain cycles

      # --- Valve 2 ---
      - service: switch.turn_on
        target:
          entity_id: switch.valve2_open
      - delay: "00:00:00.500"
      - service: switch.turn_off
        target:
          entity_id: switch.valve2_open

      - delay: "00:00:20"

      - service: switch.turn_on
        target:
          entity_id: switch.valve2_close
      - delay: "00:00:00.500"
      - service: switch.turn_off
        target:
          entity_id: switch.valve2_close

      - delay: "00:00:20"

      # --- Valve 3 ---
      - service: switch.turn_on
        target:
          entity_id: switch.valve3_open
      - delay: "00:00:00.500"
      - service: switch.turn_off
        target:
          entity_id: switch.valve3_open

      - delay: "00:00:20"

      - service: switch.turn_on
        target:
          entity_id: switch.valve3_close
      - delay: "00:00:00.500"
      - service: switch.turn_off
        target:
          entity_id: switch.valve3_close

      # --- Done ---
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.flush_in_progress

      - service: notify.mobile_app_your_phone
        data:
          message: "Flush cycle complete"