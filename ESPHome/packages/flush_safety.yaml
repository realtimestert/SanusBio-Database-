input_boolean:
  flush_in_progress:
    name: "Flush In Progress"
    icon: mdi:water-sync

automation:
  - alias: "Flush Schedule - Board 1"
    trigger:
      - platform: time
        at: "06:00:00"
      - platform: time
        at: "18:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.flush_in_progress
        state: "off"
    action:
      - service: script.flush_board1

  - alias: "Flush Schedule - Board 2"
    trigger:
      - platform: time
        at: "06:30:00"                         # Offset 30min after board 1
      - platform: time
        at: "18:30:00"
    condition:
      - condition: state
        entity_id: input_boolean.flush_in_progress
        state: "off"
    action:
      - service: script.flush_board2

  - alias: "Flush Schedule - Board 3"
    trigger:
      - platform: time
        at: "07:00:00"                         # Offset 30min after board 2
      - platform: time
        at: "19:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.flush_in_progress
        state: "off"
    action:
      - service: script.flush_board3

  - alias: "Prevent Concurrent Flush"
    trigger:
      - platform: state
        entity_id:
          - switch.athom_8ch_relay_board_b0a984_relay1
          - switch.athom_8ch_relay_board_b0a984_relay2
          - switch.athom_8ch_relay_board_b0a984_relay3
          - switch.athom_8ch_relay_board_b0a984_relay4
          - switch.athom_8ch_relay_board_b0a984_relay5
          - switch.athom_8ch_relay_board_b0a984_relay6
          - switch.athom_8ch_relay_board_b0a984_relay7
          - switch.athom_8ch_relay_board_b0a984_relay8
          # Board 2 — add when hardware arrives
          # Board 3 — add when hardware arrives
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.flush_in_progress
        state: "on"
    action:
      - service: logbook.log
        data:
          name: "Flush Error"
          message: "Attempted concurrent flush — blocked"