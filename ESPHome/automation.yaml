script:
  flush_sequence:
    alias: "Flush Sequence"
    sequence:

      # --- Valve 1 ---
      - service: switch.turn_on
        target:
          entity_id: switch.valve1_open       # Forward: opens valve
      - delay: "00:00:00.500"                  # Hold for 0.5s
      - service: switch.turn_off
        target:
          entity_id: switch.valve1_open        # Cut power to forward relay

      - delay: "00:00:30"                      # 30s before reversing

      - service: switch.turn_on
        target:
          entity_id: switch.valve1_close       # Reverse: closes valve
      - delay: "00:00:00.500"                  # Hold for 0.5s
      - service: switch.turn_off
        target:
          entity_id: switch.valve1_close       # Cut power to reverse relay

      - delay: "00:20:00"                      # 20-min refill before next valve

      # --- Valve 2 ---
      - service: switch.turn_on
        target:
          entity_id: switch.valve2_open
      - delay: "00:00:00.500"
      - service: switch.turn_off
        target:
          entity_id: switch.valve2_open

      - delay: "00:00:30"

      - service: switch.turn_on
        target:
          entity_id: switch.valve2_close
      - delay: "00:00:00.500"
      - service: switch.turn_off
        target:
          entity_id: switch.valve2_close

      - delay: "00:20:00"

      # --- Valve 3 ---
      - service: switch.turn_on
        target:
          entity_id: switch.valve3_open
      - delay: "00:00:00.500"
      - service: switch.turn_off
        target:
          entity_id: switch.valve3_open

      - delay: "00:00:30"

      - service: switch.turn_on
        target:
          entity_id: switch.valve3_close
      - delay: "00:00:00.500"
      - service: switch.turn_off
        target:
          entity_id: switch.valve3_close

      # --- Done ---
      - service: notify.mobile_app_your_phone
        data:
          message: "Flush cycle complete"