script:
  flush_sequence:
    sequence:
      # Valve 1
      - service: switch.turn_on
        target:
          entity_id: switch.valve1_open  # From ESPHome node

      - delay: "00:00:20"  # 20-second flush

      - service: switch.turn_on
        target:
          entity_id: switch.valve1_close

      - delay: "00:20:00"  # 20-minute refill break

      # Valve 2
      - service: switch.turn_on
        target:
          entity_id: switch.valve2_open

      - delay: "00:00:20"

      - service: switch.turn_on
        target:
          entity_id: switch.valve2_close

      - delay: "00:20:00"

      # Repeat pattern for valves 3–6

      # Optional notification
      - service: notify.mobile_app_your_phone
        data:
          message: "Flush cycle complete"
