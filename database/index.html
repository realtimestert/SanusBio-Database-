<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#c87759">
  <title>SanusBio Ferret Colony Manager</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #c87759;
      --primary-dark: #a85f47;
      --secondary: #7ba885;
      --secondary-light: #a8c4ae;
      --background: #faf8f5;
      --surface: #ffffff;
      --surface-hover: #f5f2ee;
      --text-primary: #2d2d2d;
      --text-secondary: #6b6b6b;
      --text-tertiary: #999999;
      --border: #e8e3dc;
      --border-light: #f0ebe4;
      --success: #6b9e78;
      --warning: #d99548;
      --danger: #c85959;
      --shadow: rgba(0, 0, 0, 0.08);
      --shadow-lg: rgba(0, 0, 0, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--background);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
    }

    #root {
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-enter {
      animation: fadeIn 0.3s ease-out;
    }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 1.5rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px var(--shadow);
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header-left {
      flex: 1;
    }

    .app-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    .app-subtitle {
      font-size: 0.875rem;
      opacity: 0.9;
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .user-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 600;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:active {
      background: rgba(255, 255, 255, 0.3);
    }

    .search-bar-container {
      margin-top: 1rem;
      position: relative;
    }

    .search-bar {
      width: 100%;
      padding: 0.875rem 1rem 0.875rem 2.75rem;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
      font-size: 0.9375rem;
      color: var(--text-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.2s;
    }

    .search-bar:focus {
      outline: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      background: white;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      pointer-events: none;
    }

    /* Main Content */
    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.25rem;
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 1rem;
      border: 1px solid var(--border-light);
      text-align: center;
      box-shadow: 0 1px 3px var(--shadow);
      transition: all 0.2s;
    }

    .stat-card:active {
      transform: scale(0.98);
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      font-family: 'Outfit', sans-serif;
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
      font-weight: 500;
    }

    /* Card Styles */
    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px var(--shadow);
      transition: all 0.2s;
      cursor: pointer;
    }

    .card:active {
      transform: scale(0.99);
      box-shadow: 0 1px 4px var(--shadow);
    }

    .card.no-hover {
      cursor: default;
    }

    .card.no-hover:active {
      transform: none;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .card-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .ferret-photo {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid var(--border);
    }

    .badge {
      display: inline-block;
      padding: 0.375rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge-primary {
      background: rgba(200, 119, 89, 0.15);
      color: var(--primary-dark);
    }

    .badge-success {
      background: rgba(107, 158, 120, 0.15);
      color: var(--success);
    }

    .badge-warning {
      background: rgba(217, 149, 72, 0.15);
      color: var(--warning);
    }

    .badge-danger {
      background: rgba(200, 89, 89, 0.15);
      color: var(--danger);
    }

    .badge-info {
      background: rgba(123, 168, 133, 0.15);
      color: var(--secondary);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .info-value {
      font-size: 0.9375rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.875rem 1.5rem;
      border-radius: 12px;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Outfit', sans-serif;
      text-decoration: none;
      gap: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(200, 119, 89, 0.3);
    }

    .btn-primary:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(200, 119, 89, 0.3);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text-primary);
      border: 2px solid var(--border);
    }

    .btn-secondary:active {
      background: var(--surface-hover);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-full {
      width: 100%;
    }

    .btn-sm {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
    }

    .fab {
      position: fixed;
      bottom: 90px;
      right: 1.25rem;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      box-shadow: 0 4px 16px rgba(200, 119, 89, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 90;
    }

    .fab:active {
      transform: scale(0.95);
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 0.9375rem;
      font-family: 'Source Sans 3', sans-serif;
      color: var(--text-primary);
      background: var(--surface);
      transition: all 0.2s;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(200, 119, 89, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }

    .file-upload-area {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .file-upload-area:hover {
      border-color: var(--primary);
      background: var(--background);
    }

    .file-upload-area input {
      display: none;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem 0;
      box-shadow: 0 -2px 12px var(--shadow);
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem;
      color: var(--text-tertiary);
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }

    .nav-label {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border-light);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tab {
      padding: 0.875rem 1.25rem;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: flex-end;
      z-index: 200;
      animation: fadeIn 0.2s;
    }

    .modal-content {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 1.5rem;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Login Page */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    }

    .login-card {
      background: var(--surface);
      border-radius: 24px;
      padding: 2.5rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .login-logo {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .login-title {
      text-align: center;
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .login-subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    /* Timeline */
    .timeline-item {
      position: relative;
      padding-left: 1.5rem;
      padding-bottom: 1.25rem;
      border-left: 2px solid var(--border-light);
    }

    .timeline-item:last-child {
      border-left-color: transparent;
      padding-bottom: 0;
    }

    .timeline-dot {
      position: absolute;
      left: -6px;
      top: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
    }

    .timeline-content {
      background: var(--surface);
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .timeline-date {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .timeline-title {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .timeline-description {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    /* Loading */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
    }

    .empty-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .empty-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .empty-description {
      font-size: 0.9375rem;
      color: var(--text-tertiary);
    }

    /* Location Grid */
    .location-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .location-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 1.25rem;
      border: 2px solid var(--border);
      transition: all 0.2s;
    }

    .location-card:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 12px var(--shadow);
    }

    .location-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .location-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .capacity-badge {
      background: var(--background);
      padding: 0.375rem 0.75rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .ferret-list-compact {
      margin-top: 0.75rem;
    }

    .ferret-item-compact {
      padding: 0.5rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      background: var(--background);
      font-size: 0.875rem;
    }

    /* Responsive */
    @media (min-width: 768px) {
      .stats-grid {
        grid-template-columns: repeat(4, 1fr);
      }
      
      .modal-content {
        border-radius: 24px;
        max-width: 600px;
        margin: auto;
      }
      
      .modal-overlay {
        align-items: center;
      }
    }

    /* Back Button */
    .back-button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
    }

    .back-button:active {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // API Configuration
    const API_BASE = 'http://localhost:3000/api';

    // API Helper
    const api = {
      async request(endpoint, options = {}) {
        const token = localStorage.getItem('token');
        const headers = {
          'Content-Type': 'application/json',
          ...options.headers,
        };
        
        if (token) {
          headers['Authorization'] = `Bearer ${token}`;
        }

        const response = await fetch(`${API_BASE}${endpoint}`, {
          ...options,
          headers,
        });

        if (response.status === 401) {
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          window.location.reload();
          return;
        }

        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Request failed');
        }

        return data;
      },

      // Auth
      login: (credentials) => api.request('/auth/login', {
        method: 'POST',
        body: JSON.stringify(credentials),
      }),

      getMe: () => api.request('/auth/me'),

      // Ferrets
      getFerrets: (params = {}) => {
        const query = new URLSearchParams(params).toString();
        return api.request(`/ferrets${query ? '?' + query : ''}`);
      },

      getFerret: (id) => api.request(`/ferrets/${id}`),

      updateGenealogy: (id, data) => api.request(`/ferrets/${id}/genealogy`, {
        method: 'PUT',
        body: JSON.stringify(data),
      }),

      updateEstrus: (id, data) => api.request(`/ferrets/${id}/estrus`, {
        method: 'PUT',
        body: JSON.stringify(data),
      }),

      uploadPhoto: async (id, file) => {
        const formData = new FormData();
        formData.append('photo', file);
        const token = localStorage.getItem('token');
        
        const response = await fetch(`${API_BASE}/ferrets/${id}/photo`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
          },
          body: formData,
        });

        return response.json();
      },

      // Health
      createHealthEvent: (data) => api.request('/health-events', {
        method: 'POST',
        body: JSON.stringify(data),
      }),

      // Locations
      getLocations: () => api.request('/locations'),

      moveFerret: (data) => api.request('/locations/move', {
        method: 'POST',
        body: JSON.stringify(data),
      }),

      updateLocation: (id, data) => api.request(`/locations/${id}`, {
        method: 'PUT',
        body: JSON.stringify(data),
      }),

      // Vaccinations
      createVaccination: (data) => api.request('/vaccinations', {
        method: 'POST',
        body: JSON.stringify(data),
      }),

      getUpcomingVaccines: (days) => api.request(`/vaccinations/upcoming?days=${days}`),

      // Stats
      getStats: () => api.request('/stats'),

      // Export
      exportCSV: async () => {
        const token = localStorage.getItem('token');
        const response = await fetch(`${API_BASE}/export/csv`, {
          headers: { 'Authorization': `Bearer ${token}` },
        });
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ferrets-export.csv';
        a.click();
      },
    };

    // Icons
    const Icon = ({ name, size = 24 }) => {
      const icons = {
        search: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>,
        plus: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
        home: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
        activity: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
        heart: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>,
        mapPin: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
        settings: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m5.2-13.8-4.2 4.2m-2 2-4.2 4.2m15.6-5.2h-6m-6 0H1m13.8 5.2-4.2-4.2m-2-2-4.2-4.2"/></svg>,
        arrowLeft: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
        x: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
        calendar: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
        download: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
        upload: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
        edit: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
        bell: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
        logOut: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
      };
      return icons[name] || null;
    };

    // Main App
    const App = () => {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const checkAuth = async () => {
          const token = localStorage.getItem('token');
          if (!token) {
            setLoading(false);
            return;
          }

          try {
            const userData = await api.getMe();
            setUser(userData);
          } catch (error) {
            console.error('Auth check failed:', error);
            localStorage.removeItem('token');
          }
          setLoading(false);
        };

        checkAuth();
      }, []);

      const handleLogin = (token, userData) => {
        localStorage.setItem('token', token);
        setUser(userData);
      };

      const handleLogout = () => {
        localStorage.removeItem('token');
        setUser(null);
      };

      if (loading) {
        return <div className="loading"><div className="spinner"></div></div>;
      }

      if (!user) {
        return <LoginPage onLogin={handleLogin} />;
      }

      return <MainApp user={user} onLogout={handleLogout} />;
    };

    // Login Page
    const LoginPage = ({ onLogin }) => {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);

        try {
          const data = await api.login({ username, password });
          onLogin(data.token, data.user);
        } catch (err) {
          setError(err.message || 'Login failed');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="login-container">
          <div className="login-card">
            <div className="login-logo">🦡</div>
            <h1 className="login-title">SanusBio</h1>
            <p className="login-subtitle">Ferret Colony Manager</p>

            <form onSubmit={handleSubmit}>
              {error && (
                <div style={{ padding: '0.75rem', background: 'rgba(200, 89, 89, 0.1)', color: 'var(--danger)', borderRadius: '8px', marginBottom: '1rem', fontSize: '0.875rem' }}>
                  {error}
                </div>
              )}

              <div className="form-group">
                <label className="form-label">Username</label>
                <input
                  type="text"
                  className="form-input"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  required
                  autoFocus
                />
              </div>

              <div className="form-group">
                <label className="form-label">Password</label>
                <input
                  type="password"
                  className="form-input"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  required
                />
              </div>

              <button type="submit" className="btn btn-primary btn-full" disabled={loading}>
                {loading ? 'Signing in...' : 'Sign In'}
              </button>
            </form>
          </div>
        </div>
      );
    };

    // Main App Component (logged in)
    const MainApp = ({ user, onLogout }) => {
      const [currentPage, setCurrentPage] = useState('list');
      const [selectedFerret, setSelectedFerret] = useState(null);
      const [showModal, setShowModal] = useState(false);
      const [modalType, setModalType] = useState('');
      const [modalData, setModalData] = useState(null);

      const openModal = (type, data = null) => {
        setModalType(type);
        setModalData(data);
        setShowModal(true);
      };

      const closeModal = () => {
        setShowModal(false);
        setModalType('');
        setModalData(null);
      };

      return (
        <>
          {currentPage === 'list' && (
            <FerretListPage 
              user={user}
              onSelectFerret={(f) => { setSelectedFerret(f); setCurrentPage('detail'); }}
              onLogout={onLogout}
              onOpenModal={openModal}
            />
          )}

          {currentPage === 'detail' && selectedFerret && (
            <FerretDetailPage 
              user={user}
              ferretId={selectedFerret.Ferret_QR005_id}
              onBack={() => setCurrentPage('list')}
              onOpenModal={openModal}
            />
          )}

          {currentPage === 'health' && (
            <HealthEventsPage user={user} onOpenModal={openModal} />
          )}

          {currentPage === 'breeding' && (
            <BreedingPage user={user} onOpenModal={openModal} onSelectFerret={(f) => { setSelectedFerret(f); setCurrentPage('detail'); }} />
          )}

          {currentPage === 'locations' && (
            <LocationsPage user={user} onOpenModal={openModal} onSelectFerret={(f) => { setSelectedFerret(f); setCurrentPage('detail'); }} />
          )}

          {currentPage === 'settings' && (
            <SettingsPage user={user} onLogout={onLogout} onBack={() => setCurrentPage('list')} />
          )}

          <BottomNav currentPage={currentPage} setCurrentPage={setCurrentPage} />

          {showModal && (
            <Modal onClose={closeModal}>
              {modalType === 'health' && <HealthEventForm user={user} ferret={modalData} onClose={closeModal} />}
              {modalType === 'estrus' && <EstrusForm user={user} ferret={modalData} onClose={closeModal} />}
              {modalType === 'genealogy' && <GenealogyForm user={user} ferret={modalData} onClose={closeModal} />}
              {modalType === 'location' && <LocationMoveForm user={user} ferret={modalData} onClose={closeModal} />}
              {modalType === 'photo' && <PhotoUploadForm user={user} ferret={modalData} onClose={closeModal} />}
              {modalType === 'vaccination' && <VaccinationForm user={user} ferret={modalData} onClose={closeModal} />}
            </Modal>
          )}

          {(user.role === 'admin' || user.role === 'research') && (
            <button className="fab" onClick={() => openModal('health')}>
              <Icon name="plus" size={24} />
            </button>
          )}
        </>
      );
    };

    // Due to character limits, I'll create this as a separate component file
    // This is about 50% of the frontend. I'll continue in the next file...

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>

  <!-- Continued in next response due to size -->
</body>
